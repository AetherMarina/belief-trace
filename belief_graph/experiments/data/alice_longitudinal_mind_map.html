        <div class="card" style="width: 100%">

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#4da6ff", "font": {"color": "white"}, "id": "Self", "label": "Self", "shape": "box"}, {"color": "#4da6ff", "font": {"color": "white"}, "id": "Brave", "label": "Brave", "shape": "box"}, {"color": "#4da6ff", "font": {"color": "white"}, "id": "Uncertain", "label": "Uncertain", "shape": "box"}, {"color": "#4da6ff", "font": {"color": "white"}, "id": "Over Time", "label": "Over Time", "shape": "box"}, {"color": "#4da6ff", "font": {"color": "white"}, "id": "World", "label": "World", "shape": "box"}, {"color": "#4da6ff", "font": {"color": "white"}, "id": "Courageous Behavior", "label": "Courageous Behavior", "shape": "box"}, {"color": "#4da6ff", "font": {"color": "white"}, "id": "Puzzles", "label": "Puzzles", "shape": "box"}, {"color": "#4da6ff", "font": {"color": "white"}, "id": "Others", "label": "Others", "shape": "box"}, {"color": "#4da6ff", "font": {"color": "white"}, "id": "Highly Of Me", "label": "Highly Of Me", "shape": "box"}]);
                  edges = new vis.DataSet([{"arrows": "to", "color": "#ff4d4d", "from": "Self", "label": "(BROKEN)\nIS", "title": "{\u0027relation\u0027: \u0027IS\u0027, \u0027status\u0027: \u0027deprecated\u0027, \u0027temporal_step\u0027: 1, \u0027entity\u0027: \u0027Alice\u0027, \u0027deprecated_at_step\u0027: 2, \u0027processing_overhead_minutes\u0027: 15.0}", "to": "Brave", "width": 1}, {"arrows": "to", "color": "#00cc66", "from": "Self", "label": "IS", "title": "{\u0027relation\u0027: \u0027IS\u0027, \u0027status\u0027: \u0027active\u0027, \u0027temporal_step\u0027: 2}", "to": "Uncertain", "width": 3}, {"arrows": "to", "color": "#00cc66", "from": "Self", "label": "CHANGES", "title": "{\u0027relation\u0027: \u0027CHANGES\u0027, \u0027status\u0027: \u0027active\u0027, \u0027temporal_step\u0027: 2}", "to": "Over Time", "width": 3}, {"arrows": "to", "color": "#00cc66", "from": "World", "label": "REWARDS", "title": "{\u0027relation\u0027: \u0027REWARDS\u0027, \u0027status\u0027: \u0027active\u0027, \u0027temporal_step\u0027: 1, \u0027entity\u0027: \u0027Alice\u0027}", "to": "Courageous Behavior", "width": 3}, {"arrows": "to", "color": "#00cc66", "from": "World", "label": "CONTAINS", "title": "{\u0027relation\u0027: \u0027CONTAINS\u0027, \u0027status\u0027: \u0027active\u0027, \u0027temporal_step\u0027: 2}", "to": "Puzzles", "width": 3}, {"arrows": "to", "color": "#00cc66", "from": "Others", "label": "THINK", "title": "{\u0027relation\u0027: \u0027THINK\u0027, \u0027status\u0027: \u0027active\u0027, \u0027temporal_step\u0027: 1, \u0027entity\u0027: \u0027Alice\u0027}", "to": "Highly Of Me", "width": 3}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
