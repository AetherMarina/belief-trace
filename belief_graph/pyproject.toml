[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "belief-graph"
version = "0.2.0"
description = "Tracing structured cognitive beliefs from narrative language and modeling how they evolve over time."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name="Marina Kaličanin"}
]
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]